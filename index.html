<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kawan English</title>
<meta name="description" content="Asisten belajar bahasa Inggris: Reading, Listening, Speaking, Writing — dari dasar sampai mahir, dengan penjelasan bahasa Indonesia.">
<meta name="theme-color" content="#14324f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14324f; --ink2:#3d5671; --muted:#6f8094; --bg:#f6f1e8; --card:#fffdf9; --line:#e6ddcf;
  --read:#0f8a7e; --listen:#d98a10; --speak:#e2553f; --write:#6b4fc8; --vocab:#2a6fdb; --ok:#1f9d55; --bad:#d64545;
  --radius:18px; --shadow:0 1px 0 rgba(20,50,79,.06),0 6px 20px -10px rgba(20,50,79,.25);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{margin:0;line-height:1.2}
.serif{font-family:"Fraunces",Georgia,serif;letter-spacing:-.01em}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding:calc(var(--sat) + 0px) 0 calc(84px + var(--sab))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:calc(var(--sat) + 14px) 18px 12px}
header.top .back{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:20px}
header.top h1{font-size:20px;font-weight:800;flex:1}
header.top .pill{font-size:13px;font-weight:700;background:var(--card);border:1px solid var(--line);padding:6px 10px;border-radius:99px;white-space:nowrap}
main{padding:4px 18px 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.hero{background:var(--ink);color:#fff;border:none;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,#f4b942 0,#f4b942 45%,transparent 46%);opacity:.95}
.hero:before{content:"";position:absolute;right:40px;bottom:-60px;width:120px;height:120px;border-radius:50%;border:18px solid rgba(255,255,255,.08)}
.hero .k{font-size:13px;opacity:.75;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.hero h2{font-size:28px;margin:6px 0 4px;position:relative;z-index:1;max-width:75%}
.hero p{margin:0;opacity:.85;font-size:14px;position:relative;z-index:1;max-width:80%}
.stats{display:flex;gap:10px;margin-top:16px;position:relative;z-index:1;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.12);border-radius:12px;padding:8px 12px;font-size:13px}
.stat b{display:block;font-size:18px}
.levels{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;margin:0 -18px 6px;padding-left:18px;padding-right:18px;scrollbar-width:none}
.levels::-webkit-scrollbar{display:none}
.lv{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:8px 14px;text-align:left}
.lv b{display:block;font-size:16px}.lv span{font-size:12px;color:var(--muted)}
.lv.on{background:var(--ink);border-color:var(--ink);color:#fff}.lv.on span{color:#cfe0f0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tile{border:none;border-radius:var(--radius);padding:16px;text-align:left;color:#fff;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow);position:relative;overflow:hidden}
.tile .ic{font-size:28px;line-height:1}
.tile b{font-size:17px;display:block}.tile small{opacity:.85;font-size:12px}
.tile .bar{height:5px;background:rgba(255,255,255,.3);border-radius:9px;margin-top:8px;overflow:hidden}
.tile .bar i{display:block;height:100%;background:#fff;border-radius:9px}
.t-read{background:var(--read)}.t-listen{background:var(--listen)}.t-speak{background:var(--speak)}.t-write{background:var(--write)}
.row{display:flex;align-items:center;gap:12px}
.list-btn{width:100%;display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;margin-bottom:10px;box-shadow:var(--shadow)}
.list-btn .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex:0 0 auto;background:#eef3f8}
.list-btn b{display:block}.list-btn small{color:var(--muted)}
.list-btn .chev{margin-left:auto;color:var(--muted);font-size:20px}
.done-dot{width:22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:13px;margin-left:auto}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:#eef3f8;color:var(--ink2)}
.btn{border:none;border-radius:14px;padding:13px 18px;font-weight:700;background:var(--ink);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.block{width:100%}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.soft{background:#eef3f8;color:var(--ink)}
.btn:disabled{opacity:.45}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btns .btn{flex:1}
.passage{font-size:18px;line-height:1.75}
.passage .w{border-radius:4px}
.passage .w:active{background:#f4e3c0}
.passage .gl{background:none;border:none;padding:0;font:inherit;color:var(--read);font-weight:700;text-decoration:underline dotted;text-underline-offset:4px}
.q{margin-top:16px}
.q p{font-weight:700;margin:0 0 8px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.opt.right{border-color:var(--ok);background:#e8f6ee}
.opt.wrong{border-color:var(--bad);background:#fbeaea}
.fb{border-radius:12px;padding:12px 14px;margin-top:8px;font-size:14px}
.fb.ok{background:#e8f6ee;color:#155f37}.fb.no{background:#fbeaea;color:#8c2727}.fb.info{background:#eef3f8;color:var(--ink2)}
textarea,input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;background:#fff;color:var(--ink);resize:vertical}
textarea:focus,input:focus{outline:none;border-color:var(--ink2)}
.big-play{width:96px;height:96px;border-radius:50%;border:none;background:var(--listen);color:#fff;font-size:38px;display:grid;place-items:center;margin:8px auto;box-shadow:0 10px 24px -10px var(--listen)}
.mic{width:96px;height:96px;border-radius:50%;border:none;background:var(--speak);color:#fff;font-size:38px;display:grid;place-items:center;margin:8px auto;box-shadow:0 10px 24px -10px var(--speak)}
.mic.rec{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(226,85,63,.5)}70%{box-shadow:0 0 0 22px rgba(226,85,63,0)}100%{box-shadow:0 0 0 0 rgba(226,85,63,0)}}
.center{text-align:center}
.rates{display:flex;gap:6px;justify-content:center;margin:6px 0}
.rates button{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700}
.rates button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.words{font-size:20px;line-height:1.8}
.words .hit{color:var(--ok);font-weight:700}.words .miss{color:var(--bad);text-decoration:underline wavy;text-underline-offset:5px}
.score{font-size:44px;font-weight:800}
.prog{height:8px;background:#e9e2d5;border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink);border-radius:9px;transition:width .3s}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:10px;border:1.5px dashed var(--line);border-radius:14px;background:#fff}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-weight:600}
.chip.used{visibility:hidden}
.flash{min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer}
.flash .word{font-size:38px}
.flash .mean{font-size:20px;font-weight:700;color:var(--vocab);margin-top:10px}
.flash .ex{color:var(--muted);margin-top:6px;font-style:italic}
.sheet-bg{position:fixed;inset:0;background:rgba(10,25,40,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 20px calc(24px + var(--sab));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(255,253,249,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:8px 8px calc(8px + var(--sab))}
nav.bottom .in{max-width:560px;margin:0 auto;display:flex}
nav.bottom button{flex:1;background:none;border:none;padding:6px 2px;font-size:11px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.bottom button span{font-size:22px;line-height:1}
nav.bottom button.on{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--sab));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:30;box-shadow:var(--shadow);animation:up .2s}
.muted{color:var(--muted)}.small{font-size:13px}
.issue{border-left:4px solid var(--write);background:#f3f0fb;border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.issue b{color:var(--write)}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:none}
ol.steps{padding-left:20px;margin:8px 0}ol.steps li{margin-bottom:8px}
.sec-title{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;margin:18px 0 10px}
</style>
</head>
<body>
<div id="app"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
